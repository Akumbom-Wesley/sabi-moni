org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# KSP 2.2.10-2.0.2 (the only KSP built against AGP 9.4's bundled Kotlin) registers its
# generated sources through kotlin.sourceSets, which built-in Kotlin rejects by
# default. Drop this once KSP migrates to android.sourceSets.
android.disallowKotlinSourceSets=false

kotlin.code.style=official
